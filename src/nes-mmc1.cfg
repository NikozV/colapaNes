##############################################################################
# Gran Premio NES - configuracion de linker para MMC1 / SxROM (mapper 1)
#
# 128 KB de PRG en 8 bancos de 16 KB + 32 KB de CHR + 8 KB de PRG-RAM.
#
# POR QUE MMC1 Y NO MMC3
# El emulador que usan los tests (nes-py) solo soporta los mappers 0, 1, 2 y 3.
# Con MMC3 la ROM no abre y perdes 'make test' y 'make shots', que es toda la
# forma de verificar que el juego anda. MMC1 da bancos de PRG, bancos de CHR y
# PRG-RAM con pila para guardar el campeonato. Lo unico que no tiene es IRQ por
# linea de barrido: el HUD fijo se hace con sprite 0 hit, que es exactamente lo
# que usa el Super Mario Bros para su barra de arriba.
#
# COMO REPARTE EL PRG (modo 3, el habitual)
#
#   $8000-$BFFF  conmutable  <- registro de banco  (segmentos BANK0..BANK6)
#   $C000-$FFFF  FIJO, ultimo banco                (CODE, RODATA, CORE, VECTORS)
#
# El banco fijo es donde tiene que vivir todo lo que no puede desaparecer
# nunca: reset, NMI, la rutina que cambia de banco y los vectores. Si el NMI
# saltara estando mapeado otro banco, la direccion apuntaria a cualquier lado.
#
# Los siete bancos conmutables son alternativas entre si: los siete se compilan
# para $8000 y en tiempo de ejecucion se elige cual esta mapeado. Un dato que
# vive en BANK2 no es visible mientras este mapeado BANK1.
#
# EL JUEGO DE HOY ENTRA SIN TOCAR UNA LINEA DE CODIGO
# Todo lo que hay ahora cabe en el banco fijo de 16 KB, que empieza en $C000,
# igual que en NROM. Solo hay que cambiar la cabecera y el CHR.
#
# ---------------------------------------------------------------------------
# CAMBIOS QUE HAY QUE HACER ADEMAS DE USAR ESTE ARCHIVO
#
# 1) La cabecera en main.s:
#
#     .segment "HEADER"
#         .byte "NES", $1A
#         .byte 8          ; 128 KB de PRG (unidades de 16 KB)
#         .byte 4          ; 32 KB de CHR  (unidades de 8 KB)
#         .byte $10        ; nibble alto = mapper 1, mirroring horizontal
#         .byte $00        ; ($12 en vez de $10 si le poner pila para guardar)
#         .res 8, 0
#
# 2) makechr.py tiene que generar 32 KB (cuatro bancos de 8 KB). Rellenar con
#    ceros los que todavia no uses.
#
# 3) Inicializar el mapper en el reset, antes de nada:
#
#     lda #$80
#     sta $8000            ; resetea el MMC1 y fuerza el modo 3
#
#    Los registros del MMC1 son SERIALES: se escriben de a un bit, cinco veces,
#    con el bit 0 del valor. Y OJO: nunca uses INC/DEC ni ningun read-modify-
#    write sobre $8000-$FFFF, porque hacen dos escrituras y le mandan basura al
#    mapper. Es el bug clasico de MMC1 y no se ve leyendo el codigo.
##############################################################################

MEMORY {
    # ---- RAM ----------------------------------------------------------------
    ZP:      start=$0000, size=$0100, type=rw, define=yes;
    OAMBUF:  start=$0200, size=$0100, type=rw, define=yes;
    RAM:     start=$0300, size=$0500, type=rw, define=yes;

    # PRG-RAM del cartucho. Aca van los datos de los 22 pilotos durante la
    # carrera y, si le poner pila, el guardado del campeonato.
    PRGRAM:  start=$6000, size=$2000, type=rw, define=yes;

    # ---- Cabecera iNES ------------------------------------------------------
    HDR:     start=$0000, size=$0010, file=%O, fill=yes;

    # ---- Bancos conmutables (los siete se compilan para $8000) --------------
    BANK0:   start=$8000, size=$4000, file=%O, fill=yes, define=yes;
    BANK1:   start=$8000, size=$4000, file=%O, fill=yes, define=yes;
    BANK2:   start=$8000, size=$4000, file=%O, fill=yes, define=yes;
    BANK3:   start=$8000, size=$4000, file=%O, fill=yes, define=yes;
    BANK4:   start=$8000, size=$4000, file=%O, fill=yes, define=yes;
    BANK5:   start=$8000, size=$4000, file=%O, fill=yes, define=yes;
    BANK6:   start=$8000, size=$4000, file=%O, fill=yes, define=yes;

    # ---- Banco fijo: $C000-$FFFF (tiene que ser el ULTIMO del archivo) ------
    FIXED:   start=$C000, size=$4000, file=%O, fill=yes, define=yes;

    # ---- CHR ----------------------------------------------------------------
    CHR:     start=$0000, size=$8000, file=%O, fill=yes;
}

SEGMENTS {
    # ---- RAM ----------------------------------------------------------------
    ZEROPAGE: load=ZP,     type=zp;
    OAM:      load=OAMBUF, type=bss, define=yes;
    BSS:      load=RAM,    type=bss, define=yes;
    XRAM:     load=PRGRAM, type=bss, define=yes, optional=yes;

    HEADER:   load=HDR,    type=ro;

    # ---- Contenido conmutable ----------------------------------------------
    # Uno por banco. Poner cada cosa grande en el suyo: la qualy no necesita
    # estar mapeada durante la carrera, ni al reves.
    BANK0:    load=BANK0,  type=ro, optional=yes;   # carrera
    BANK1:    load=BANK1,  type=ro, optional=yes;   # qualy y parrilla
    BANK2:    load=BANK2,  type=ro, optional=yes;   # boxes, menus, gomas
    BANK3:    load=BANK3,  type=ro, optional=yes;   # tablas: pilotos, equipos, textos
    BANK4:    load=BANK4,  type=ro, optional=yes;   # musica y sonido
    BANK5:    load=BANK5,  type=ro, optional=yes;   # libre
    BANK6:    load=BANK6,  type=ro, optional=yes;   # libre

    # ---- Banco fijo ---------------------------------------------------------
    # CORE es para el arranque, el NMI y el cambio de banco: dejalo chico y no
    # le metas contenido del juego. CODE y RODATA son lo que se usa siempre.
    CORE:     load=FIXED,  type=ro, optional=yes;
    CODE:     load=FIXED,  type=ro;
    RODATA:   load=FIXED,  type=ro, optional=yes;
    VECTORS:  load=FIXED,  type=ro, start=$FFFA;

    CHARS:    load=CHR,    type=ro;
}
