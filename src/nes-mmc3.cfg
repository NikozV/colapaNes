##############################################################################
# Gran Premio NES - configuracion de linker para MMC3 (mapper 4)
#
# 64 KB de PRG en 8 bancos de 8 KB + 32 KB de CHR.
#
# Como reparte el PRG el MMC3 (modo 0):
#
#   $8000-$9FFF  conmutable  <- registro R6   (segmentos BANK0..BANK5)
#   $A000-$BFFF  conmutable  <- registro R7   (segmentos BANK0..BANK5)
#   $C000-$DFFF  FIJO, anteultimo banco       (segmento CODE)
#   $E000-$FFFF  FIJO, ultimo banco           (segmentos CORE y VECTORS)
#
# Los dos bancos fijos no se pueden cambiar por hardware: ahi va todo lo que
# tiene que estar SIEMPRE mapeado. Reset, NMI, la rutina que cambia de banco y
# los vectores no pueden vivir en un banco conmutable, porque si el NMI salta
# mientras estabas en otro banco, la direccion apunta a cualquier lado.
#
# Los seis bancos conmutables son alternativas entre si: los seis se compilan
# para $8000, y en tiempo de ejecucion se elige cual esta mapeado. Un dato en
# BANK2 no es visible mientras este mapeado BANK1.
#
# ---------------------------------------------------------------------------
# Este archivo solo NO alcanza. Hay que cambiar tambien la cabecera en main.s:
#
#     .segment "HEADER"
#         .byte "NES", $1A
#         .byte 4          ; 64 KB de PRG (unidades de 16 KB)
#         .byte 4          ; 32 KB de CHR (unidades de 8 KB)
#         .byte $40        ; nibble alto = mapper 4, mirroring horizontal
#         .byte $00
#         .res 8, 0
#
# Y el CHR pasa a ser de 32 KB, asi que makechr.py tiene que generar cuatro
# bancos de 8 KB (o rellenar con ceros los que todavia no uses).
##############################################################################

MEMORY {
    # ---- RAM ----------------------------------------------------------------
    ZP:      start=$0000, size=$0100, type=rw, define=yes;
    OAMBUF:  start=$0200, size=$0100, type=rw, define=yes;
    RAM:     start=$0300, size=$0500, type=rw, define=yes;

    # PRG-RAM del cartucho. El MMC3 la soporta y hay que habilitarla por
    # registro. Aca van a vivir los datos de los 22 pilotos y, mas adelante,
    # el guardado del campeonato si le poner pila.
    PRGRAM:  start=$6000, size=$2000, type=rw, define=yes;

    # ---- Cabecera iNES ------------------------------------------------------
    HDR:     start=$0000, size=$0010, file=%O, fill=yes;

    # ---- Bancos conmutables (los seis se compilan para $8000) ---------------
    BANK0:   start=$8000, size=$2000, file=%O, fill=yes, define=yes;
    BANK1:   start=$8000, size=$2000, file=%O, fill=yes, define=yes;
    BANK2:   start=$8000, size=$2000, file=%O, fill=yes, define=yes;
    BANK3:   start=$8000, size=$2000, file=%O, fill=yes, define=yes;
    BANK4:   start=$8000, size=$2000, file=%O, fill=yes, define=yes;
    BANK5:   start=$8000, size=$2000, file=%O, fill=yes, define=yes;

    # ---- Bancos fijos -------------------------------------------------------
    FIX0:    start=$C000, size=$2000, file=%O, fill=yes, define=yes;
    FIX1:    start=$E000, size=$2000, file=%O, fill=yes, define=yes;

    # ---- CHR ----------------------------------------------------------------
    CHR:     start=$0000, size=$8000, file=%O, fill=yes;
}

SEGMENTS {
    # ---- RAM ----------------------------------------------------------------
    ZEROPAGE: load=ZP,     type=zp;
    OAM:      load=OAMBUF, type=bss, define=yes;
    BSS:      load=RAM,    type=bss, define=yes;
    XRAM:     load=PRGRAM, type=bss, define=yes, optional=yes;

    HEADER:   load=HDR,    type=ro;

    # ---- Contenido conmutable ----------------------------------------------
    # Uno por banco. Poner cada cosa grande en el suyo: la qualy no necesita
    # estar mapeada durante la carrera, ni al reves.
    BANK0:    load=BANK0,  type=ro, optional=yes;   # carrera
    BANK1:    load=BANK1,  type=ro, optional=yes;   # qualy y parrilla
    BANK2:    load=BANK2,  type=ro, optional=yes;   # boxes, menus, gomas
    BANK3:    load=BANK3,  type=ro, optional=yes;   # tablas: pilotos, equipos, textos
    BANK4:    load=BANK4,  type=ro, optional=yes;   # musica y sonido
    BANK5:    load=BANK5,  type=ro, optional=yes;   # libre

    # ---- Banco fijo bajo: $C000-$DFFF --------------------------------------
    # El grueso del codigo que se usa siempre.
    CODE:     load=FIX0,   type=ro;
    RODATA:   load=FIX0,   type=ro, optional=yes;

    # ---- Banco fijo alto: $E000-$FFFF --------------------------------------
    # Lo que NO puede desaparecer nunca: arranque, interrupciones, cambio de
    # banco. Dejalo chico y no le metas contenido del juego.
    CORE:     load=FIX1,   type=ro, optional=yes;
    VECTORS:  load=FIX1,   type=ro, start=$FFFA;

    CHARS:    load=CHR,    type=ro;
}
